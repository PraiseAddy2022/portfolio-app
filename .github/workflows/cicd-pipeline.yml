on: push

jobs:
   build:
    runs-on: ubuntu-latest
    steps:
       - name: checkout code
         uses: actions/checkout@v6
       - name: build image
         run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolioci:${{github.run_number}} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolioci .

       - name: docker login
         uses: docker/login-action@v4
         with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
         
  
       - name: Push image to registry
         run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolioci:${{github.run_number}}
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolioci 
    
   deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: ssh to linux and run container
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.PRIVATE_KEY}}
            script: |
              docker rm -f profile || echo " container not found, skip removal ."
              docker rmi -f ${{secrets.DOCKER_USERNAME}}/portfolioci || echo "image do not exist"
              docker run -d --name new -p 8080:80 ${{secrets.DOCKER_USERNAME}}/portfolioci
      

