on: push

jobs:
   build:
    runs-on: ubuntu-latest
    steps:
       - name: checkout code
         uses: actions/checkout@v6
       - name: build image
         run: docker build -t ${{secrets.DOCKER_USERNAME}}/portfolioci .
       - name: docker login
         uses: docker/login-action@v4
         with:
          username: ${{secrets. DOCKER_USERNAME}}
          password: ${{secrets. DOCKER_PASSWORD}}
         
  
       - name: Push image to registry
         run: docker push ${{secrets.DOCKER_PASSWORD}}/portfolioci  


